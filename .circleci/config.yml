version: 2.1

# This job installs from the built wheel plus bare pytest/pyyaml -- it does NOT
# provision from environment.yml (conda), on purpose. environment.yml is for
# local development (editable install, streamlit, plotly, the full app
# toolchain); this job checks what a `pip install cyclophaser` user actually
# gets. Keeping the two apart is a deliberate choice, not an oversight: this
# minimal install is exactly what caught `plotly` being undeclared, and what
# caught the series_sha256 hash instability documented in
# docs/future_work.md items 10-12 -- a real, measured failure mode this same
# thin environment surfaced that a conda-provisioned CI would not have.
# See docs/future_work.md item 12 for the full record of that decision.

jobs:
  build_test:
    docker:
      - image: cimg/python:3.12.3
    steps:
      - checkout

      - run:
          name: Install build tools
          command: pip install --upgrade pip build

      - run:
          name: Build sdist and wheel
          command: python -m build

      - run:
          name: Install package from wheel
          command: pip install dist/*.whl

      - run:
          name: Install test dependencies
          # PyYAML is NOT a dependency of cyclophaser and must not become one --
          # the package never reads or writes YAML. It is here because the
          # manual-labelling front's artefact is a YAML file, and without it the
          # 8 round-trip/atomicity tests that guard that artefact were being
          # SKIPPED in CI: the artefact was unprotected in the one place that
          # runs on every push.
          command: pip install pytest pyyaml

      - run:
          name: Run tests against the installed wheel
          # `python -m pytest` from the checkout would import cyclophaser/ from
          # the source tree (CWD first on sys.path, and the default prepend
          # import mode puts the repo root there too), so it would not test the
          # wheel. Bare `pytest` with --import-mode=append keeps site-packages
          # ahead of the root; CYCLOPHASER_REQUIRE_INSTALLED makes
          # tests/conftest.py fail the session if cyclophaser still comes from
          # anywhere but site-packages, printing the path it found.
          environment:
            CYCLOPHASER_REQUIRE_INSTALLED: "1"
          command: pytest --import-mode=append -m "not source_tree" --junitxml=test-reports/results.xml

      - run:
          name: Run source-tree tests against the checkout
          # Tests marked source_tree import research code that asserts it runs
          # on the repository's own cyclophaser/ (item30_core.py), so they can
          # never pass against the wheel. Run them here, on the source, without
          # the lock.
          command: python -m pytest -m source_tree --junitxml=test-reports/results-source-tree.xml

      - store_test_results:
          path: test-reports
          when: always

  app_test:
    # The calibration app's tests (AppTest and the app's core modules) against
    # the wheel of this commit, plus the whole package suite again with the app
    # dependencies installed. Two legs: `floor` pins streamlit to the app's
    # declared floor (1.56.0), `newest` installs whatever pip resolves today --
    # what the public app gets on its next deploy -- so a red `newest` with no
    # code change is an upstream release breaking the app. The pip freeze of
    # each leg is stored as an artifact to attribute such a red.
    parameters:
      leg:
        type: enum
        enum: ["floor", "newest"]
    docker:
      - image: cimg/python:3.12.3
    resource_class: medium
    steps:
      - checkout

      - run:
          name: Install build tools
          command: pip install --upgrade pip build

      - run:
          name: Build sdist and wheel
          command: python -m build

      - run:
          name: Install wheel and app test dependencies (<< parameters.leg >>)
          # One pip call, so pip resolves the wheel and the app dependencies
          # together, as a user installing both would.
          command: |
            if [ "<< parameters.leg >>" = "floor" ]; then
              STREAMLIT="streamlit==1.56.0"
            else
              STREAMLIT="streamlit"
            fi
            pip install dist/*.whl "$STREAMLIT" plotly pyyaml pytest
            mkdir -p artifacts
            pip freeze > artifacts/pip-freeze-<< parameters.leg >>.txt
            cat artifacts/pip-freeze-<< parameters.leg >>.txt

      - run:
          name: Run tests against the installed wheel, with the app
          # Same provenance lock and import mode as build_test. The second
          # variable makes tests/conftest.py stop the session with a UsageError
          # if streamlit, plotly or yaml does not import, instead of letting the
          # app tests skip themselves into a green job.
          environment:
            CYCLOPHASER_REQUIRE_INSTALLED: "1"
            CYCLOPHASER_REQUIRE_APP_DEPS: "1"
          command: pytest --import-mode=append -m "not browser and not source_tree" --junitxml=test-reports/results.xml

      - run:
          name: Check that only the allowed tests skipped
          # Exactly the 5 ids in .circleci/check_app_skips.py, by junit id,
          # never by skip-reason text.
          command: python .circleci/check_app_skips.py test-reports/results.xml

      - store_test_results:
          path: test-reports
          when: always

      - store_artifacts:
          path: artifacts
          when: always

  app_control:
    # NEGATIVE CONTROLS (c)/(d), disposable branch only. Each must go red.
    parameters:
      control:
        type: enum
        enum: ["noplotly", "python_m"]
    docker:
      - image: cimg/python:3.12.3
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install build tools
          command: pip install --upgrade pip build
      - run:
          name: Build sdist and wheel
          command: python -m build
      - run:
          name: Install (<< parameters.control >>)
          command: |
            if [ "<< parameters.control >>" = "noplotly" ]; then
              pip install dist/*.whl streamlit pyyaml pytest
            else
              pip install dist/*.whl "streamlit==1.56.0" plotly pyyaml pytest
            fi
            pip freeze
      - run:
          name: Run tests (<< parameters.control >>)
          environment:
            CYCLOPHASER_REQUIRE_INSTALLED: "1"
            CYCLOPHASER_REQUIRE_APP_DEPS: "1"
          command: |
            if [ "<< parameters.control >>" = "noplotly" ]; then
              pytest --import-mode=append -m "not browser and not source_tree" --junitxml=test-reports/results.xml
            else
              python -m pytest --import-mode=append -m "not browser and not source_tree" --junitxml=test-reports/results.xml
            fi
      - store_test_results:
          path: test-reports
          when: always

  test_pypi_publish:
    docker:
      - image: cimg/python:3.12.3
    steps:
      - checkout

      - run:
          name: Install build and publish tools
          command: pip install --upgrade pip build "twine>=6.0"

      - run:
          name: Build sdist and wheel
          command: python -m build

      - run:
          name: Check distribution
          command: twine check dist/*

      - run:
          name: Publish to TestPyPI
          command: twine upload --skip-existing -u ${TESTPY_LOGIN} -p ${TESTPY_PASSWORD} --repository testpypi dist/* --verbose

  pypi_publish:
    docker:
      - image: cimg/python:3.12.3
    steps:
      - checkout

      - run:
          name: Install build and publish tools
          command: pip install --upgrade pip build "twine>=6.0"

      - run:
          name: Build sdist and wheel
          command: python -m build

      - run:
          name: Check distribution
          command: twine check dist/*

      - run:
          name: Publish to PyPI
          command: twine upload --skip-existing dist/* --verbose

workflows:
  build_test_publish:
    jobs:
      - build_test
      - app_test:
          name: app_test_<< matrix.leg >>
          matrix:
            parameters:
              leg: ["floor", "newest"]
          filters:
            branches:
              only:
                - develop
                - master
                - /^ci\/.*/
      - app_control:
          name: app_control_<< matrix.control >>
          matrix:
            parameters:
              control: ["noplotly", "python_m"]
          filters:
            branches:
              only:
                - ci/app-tests-controls
      - test_pypi_publish:
          requires:
            - build_test
            - app_test_floor
            - app_test_newest
          filters:
            branches:
              only:
                - develop
      - pypi_publish:
          requires:
            - build_test
            - app_test_floor
            - app_test_newest
          filters:
            branches:
              only:
                - master
