batch: swell_item30
base: Gramcianinov et al. (2020), Atlantic extratropical cyclone tracks (TRACK on ERA5), Mendeley
  Data 4, 108111 — the same base as the 51 labelled real series
via: 'cyclone_monitor: per-cyclone Parquet files under data/processed/tracks_by_id on swell;
  200 of 6789 drawn with random.Random(29).sample over the sorted list'
id: the original TRACK id of the cyclone_monitor file, unchanged
conversion: min_max_zeta_850 = -1e-5 * vor42 (vor42 in 1e-5 s^-1, positive)
conversion_check: 'MEASURED (item 30 step 0d) on 20180733, the one swell track that is also
  a labelled TRAIN series: -1e-5 * vor42 vs the repo series — same 257 hourly times (lag 0),
  max|diff| 1.36e-20 (max relative 1.7e-16, 1 ulp; 218/257 bit-identical), mean ratio 1.000,
  sign 257/257 negative; the standard-format file itself is byte-identical to tests/calibration_data/20180733.csv.
  20203389 (TEST) is byte-identical too; its label was not read.'
format: time;min_max_zeta_850, hourly, copied byte for byte
